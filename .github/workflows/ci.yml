name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: go test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

  escalation:
    # End-to-end permission matrix: an elevated init, then every command and
    # several bypass attempts as a regular user (test/e2e/escalation.*).
    name: escalation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          go build -o "bin/morrow$ext" .
          go -C doc/assets/demo/demo-api build -o "$PWD/bin/demo-api$ext" .
      - name: matrix (Linux, regular user vs sudo)
        if: runner.os == 'Linux'
        run: sudo sh test/e2e/escalation.sh "$USER" "$PWD/bin/morrow" "$PWD/bin/demo-api"
      - name: matrix (Windows, throwaway non-admin user vs Administrator)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/e2e/escalation.ps1 -Morrow bin/morrow.exe -DemoApi bin/demo-api.exe

  lifecycle:
    # Graceful stop, stop timeout, restart on crash with backoff, giving up and
    # cancelling a restart, with real processes (test/e2e/lifecycle.*).
    name: lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          go build -o "bin/morrow$ext" .
      - name: lifecycle (Linux)
        if: runner.os == 'Linux'
        run: sh test/e2e/lifecycle.sh "$PWD/bin/morrow"
      - name: relay death (Linux)
        if: runner.os == 'Linux'
        # As a regular user, then as root with --user and a real OOM kill.
        run: |
          sh test/e2e/relay.sh "$PWD/bin/morrow"
          sudo sh test/e2e/relay.sh "$PWD/bin/morrow" nobody
      - name: health checks (Linux)
        if: runner.os == 'Linux'
        run: |
          go build -o bin/healthapp ./test/e2e/healthapp
          sh test/e2e/health.sh "$PWD/bin/morrow" "$PWD/bin/healthapp"
          sudo sh test/e2e/health.sh "$PWD/bin/morrow" "$PWD/bin/healthapp" nobody
      - name: lifecycle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/e2e/lifecycle.ps1 -Morrow bin/morrow.exe

  startup:
    # Start at boot with the real OS hook: a systemd unit on Linux, a scheduled
    # task running as SYSTEM on Windows; a reboot is simulated by killing every
    # app and relay (test/e2e/startup.*).
    name: startup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          go build -o "bin/morrow$ext" .
      - name: startup (Linux, systemd)
        if: runner.os == 'Linux'
        run: sudo sh test/e2e/startup.sh "$PWD/bin/morrow"
      - name: startup (Windows, scheduled task)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/e2e/startup.ps1 -Morrow bin/morrow.exe

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same targets as the Makefile.
          # `artifact` is the Makefile's file name suffix; verifydist checks
          # the binary really targets it.
          - { goos: windows, goarch: amd64, artifact: windows-x64.exe }
          - { goos: windows, goarch: "386", artifact: windows-x86.exe }
          - { goos: windows, goarch: arm64, artifact: windows-arm64.exe }
          - { goos: linux, goarch: amd64, artifact: linux-amd64 }
          - { goos: linux, goarch: arm64, artifact: linux-arm64 }
          - { goos: linux, goarch: arm, goarm: "7", artifact: linux-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -o "dist/ci/morrow-vci_${{ matrix.artifact }}" .
      - name: verify artifact format
        run: go run ./script/verifydist dist/ci
